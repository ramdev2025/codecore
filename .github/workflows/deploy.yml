name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A deploy supersedes whatever is still rolling out; don't queue them.
  group: deploy-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install
        run: pip install -r requirements.txt

      # The suite is fully offline — no database, no network — so it needs no
      # secrets and is a real gate rather than a formality.
      - name: Test
        run: pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
