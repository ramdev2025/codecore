# Fly.io deployment for Jupiter.
#
# `app` must be globally unique across all of Fly — "jupiter" is long taken.
# This only sets the internal *.fly.dev hostname; the public address is
# jupiter.workmov.com, set up via `fly certs add` (see DEPLOY.md).
app = 'jupiter-workmov'

# Singapore. The Neon database is in ap-southeast-1, and every request here
# makes several round trips to it, so co-locating is the single biggest
# latency win available.
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  processes = ['app']

  # Always-on, deliberately. The MCP StreamableHTTPSessionManager holds session
  # state in memory and the dashboard holds an open SSE stream; a machine that
  # suspends drops both, and a teammate's Claude Code would see its MCP
  # connection die mid-session.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Connections rather than requests: SSE streams and WebSockets are long-lived,
  # so a request-based limit would badly misread how loaded this app is.
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  # 1GB is not padding. Importing LangChain and AgentFlow costs a few hundred
  # MB before a single request is served, and a 512MB machine OOMs on boot.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
